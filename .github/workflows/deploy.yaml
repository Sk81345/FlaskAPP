on:
  push:
    branches:
      - flasktest

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    
    - name: Build and Push Docker Image
      run: |
        az acr build \
          --registry ${{ secrets.ACR_NAME }} \
          --image gha-demo-app:latest \
          .
        
    - name: Deploy to Azure Container Apps
      run: |
        az containerapp update \
          --name gha-demo-app \
          --resource-group ${{ secrets.AZURE_RG }} \
          --image ${{ secrets.ACR_NAME }}.azurecr.io/gha-demo-app:latest


